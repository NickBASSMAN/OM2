<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <div id="controls">
      <div class="toolbarSites">
        <button class="toolbarSiteIcon toolbarSiteIcon-chaturbate" data-site-url="https://chaturbate.com/" title="Chaturbate" aria-label="Chaturbate"></button>
        <button class="toolbarSiteIcon toolbarSiteIcon-bongacams" data-site-url="https://bongacams.com/" title="BongaCams" aria-label="BongaCams"></button>
        <button class="toolbarSiteIcon toolbarSiteIcon-stripchat" data-site-url="https://stripchat.com/" title="Stripchat" aria-label="Stripchat"></button>
      </div>
      <div class="toolbarActions">
        <button id="importBtn" title="Import models"></button>
        <button id="exportBtn" title="Export models"></button>
        <button id="addModelBtn" title="Add model"></button>
        <button id="refreshBtn" title="Refresh status"></button>
      </div>
    </div>

    <div id="models"></div>
    <div id="previewPlayer" aria-hidden="true">
      <canvas width="294" height="166"></canvas>
    </div>

  </div>

  <script src="../shared/sites.js"></script>
  <script src="model-io.js"></script>
  <script src="../imageplayer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
